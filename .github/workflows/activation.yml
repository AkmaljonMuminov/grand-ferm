name: Acquire activation file

# Bir martalik: Unity Personal litsenziyasi uchun .alf faylini yaratadi.
# Artifact'ni yuklab oling -> https://license.unity3d.com/manual ga yuklang -> .ulf oling -> UNITY_LICENSE secret.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/activation.yml"

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Create manual activation file
        run: |
          mkdir out
          docker run --rm -v "$PWD/out:/out" -w /out unityci/editor:ubuntu-2022.3.50f1-base-3 \
            bash -c "unity-editor -batchmode -nographics -createManualActivationFile -logfile - ; chmod a+rw /out/* || true" || true
          ls -la out
          test -n "$(ls out/*.alf 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: out/*.alf
